<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NGABACOT BEBAS</title>
    <script>
      // Shim process.env paling awal untuk mencegah crash global
      window.process = window.process || { env: {} };
      // Fallback jika API_KEY tidak terdeteksi langsung
      if (!window.process.env) window.process.env = {};
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0b0c0d;
        margin: 0;
        color: white;
        overflow-x: hidden;
      }
      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 1.5rem;
        background: radial-gradient(circle at center, #1e1b4b 0%, #0b0c0d 100%);
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(79, 70, 229, 0.1);
        border-left-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        box-shadow: 0 0 20px rgba(79, 70, 229, 0.2);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loading-text {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.3em;
        color: #818cf8;
        text-transform: uppercase;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.553.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "jszip": "https://aistudiocdn.com/jszip@^3.10.1"
  }
}
</script>
</head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <p class="loading-text">Memuat Engine Produksi...</p>
      </div>
    </div>
  </body>
</html>
