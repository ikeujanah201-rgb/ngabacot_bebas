<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NGABACOT BEBAS | Studio Batch TTS</title>
    <script>
      // Shim process.env untuk browser lingkungan Vercel/Production
      window.process = { env: { API_KEY: "" } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { studio: { dark: '#0b0c0d', card: '#1e1f20', accent: '#4f46e5' } }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      body { background-color: #0b0c0d; color: white; margin: 0; font-family: 'Inter', sans-serif; }
      #initial-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 9999;
        background: radial-gradient(circle at center, #1e1b4b 0%, #0b0c0d 100%);
      }
      .spinner {
        width: 60px; height: 60px; border: 4px solid rgba(79, 70, 229, 0.1);
        border-left-color: #4f46e5; border-radius: 50%;
        animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 30px rgba(79, 70, 229, 0.2);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-text {
        margin-top: 1.5rem; font-size: 10px; font-weight: 900;
        letter-spacing: 0.4em; color: #818cf8; text-transform: uppercase;
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.553.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
        "jszip": "https://aistudiocdn.com/jszip@^3.10.1"
      }
    }
    </script>
  </head>
  <body class="dark">
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <p class="loader-text">Initializing AI Studio...</p>
      </div>
    </div>
  </body>
</html>
